app-id: org.dupot.littleadventure
base: org.godotengine.godot.BaseApp
base-version: '4.7'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: littleAdventure
finish-args:
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --persist=.local/share/godot/app_userdata/LittleAdventure

modules:
  - name: littleAdventure
    buildsystem: simple

    build-commands:
      - install -Dm755 littleAdventure.sh /app/bin/littleAdventure
      - install -Dm644 gameArchive/littleAdventure.pck /app/bin/littleAdventure.pck
      - install -Dm644 gameArchive/icons/16x16.png $FLATPAK_DEST/share/icons/hicolor/16x16/apps/org.dupot.littleadventure.png
      - install -Dm644 gameArchive/icons/24x24.png $FLATPAK_DEST/share/icons/hicolor/24x24/apps/org.dupot.littleadventure.png
      - install -Dm644 gameArchive/icons/32x32.png $FLATPAK_DEST/share/icons/hicolor/32x32/apps/org.dupot.littleadventure.png
      - install -Dm644 gameArchive/icons/48x48.png $FLATPAK_DEST/share/icons/hicolor/48x48/apps/org.dupot.littleadventure.png
      - install -Dm644 gameArchive/icons/64x64.png $FLATPAK_DEST/share/icons/hicolor/64x64/apps/org.dupot.littleadventure.png
      - install -Dm644 gameArchive/icons/128x128.png $FLATPAK_DEST/share/icons/hicolor/128x128/apps/org.dupot.littleadventure.png
      - install -Dm644 gameArchive/icons/256x256.png $FLATPAK_DEST/share/icons/hicolor/256x256/apps/org.dupot.littleadventure.png
      - install -Dm644 gameArchive/icons/512x512.png $FLATPAK_DEST/share/icons/hicolor/512x512/apps/org.dupot.littleadventure.png
      - install -Dm644 gameArchive/${FLATPAK_ID}.desktop $FLATPAK_DEST/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 gameArchive/${FLATPAK_ID}.appdata.xml $FLATPAK_DEST/share/metainfo/${FLATPAK_ID}.metainfo.xml

    sources:
      - type: archive
        dest: gameArchive
        url: https://github.com/imikado/dupotLittleAdventure/releases/download/1.23.1/bundle.tar.gz
        sha256: 69e0065d02c0919921545ae053a7a3a79a253c491b9bda281d1b387f96253da3

      - type: script
        dest-filename: littleAdventure.sh
        commands:
          - cd /app/bin/
          - /app/bin/godot-runner --main-pack /app/bin/littleAdventure.pck "$@"
